name: Daily Story Generator (YouTube + TikTok)

on:
  schedule:
    # Automatically mutated to a new random hour & minute after every daily run
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      custom_theme:
        description: 'Optional custom story theme (leave empty for automatic daily theme)'
        required: false
        default: ''
      skip_upload:
        description: 'Generate videos only without uploading to YouTube/TikTok'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -n "${{ secrets.TIKTOK_COOKIES_JSON }}" ]; then
            playwright install chromium --with-deps
          fi

      - name: Random anti-detection delay (only on scheduled cron runs)
        if: github.event_name == 'schedule'
        run: |
          DELAY_SEC=$(( 60 + RANDOM % 1140 ))
          echo "Sleeping for ${DELAY_SEC} seconds (~$(( DELAY_SEC / 60 )) mins) to add natural timing jitter..."
          sleep "${DELAY_SEC}"

      - name: Run Master Story Generation & Dual Upload Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          TTS_VOICE: en-US-AriaNeural
          IMAGE_PROVIDER: pollinations
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: black-forest-labs/flux.1-schnell
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
          YOUTUBE_MADE_FOR_KIDS: 'true'
          TIKTOK_UPLOAD_MODE: auto
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_COOKIES_JSON: ${{ secrets.TIKTOK_COOKIES_JSON }}
        run: |
          ARGS=()
          if [ -n "${{ github.event.inputs.custom_theme }}" ]; then
            ARGS+=(--theme "${{ github.event.inputs.custom_theme }}")
          fi
          if [ "${{ github.event.inputs.skip_upload }}" == "true" ]; then
            ARGS+=(--skip-upload)
          fi
          python main.py "${ARGS[@]}"

      - name: Upload generated videos & subtitles as workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-story-${{ github.run_number }}
          path: |
            output/final_story_youtube_16x9.mp4
            output/final_story_tiktok_9x16.mp4
            output/subtitles.srt
            output/metadata.json
          retention-days: 7

      - name: Randomize cron schedule for tomorrow (different post time every day)
        if: always()
        run: |
          python scripts/randomize_cron.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/daily_story.yml
          git diff --staged --quiet || git commit -m "chore(schedule): randomize next daily post time [skip ci]"
          git push
