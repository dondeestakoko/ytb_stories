name: Daily Story Generator (YouTube + TikTok)

on:
  schedule:
    # 3 staggered daily cron slots (off-peak + afternoon + evening backup) so GitHub Actions
    # queue load never drops a day. A built-in check ensures at most 1 run publishes per day.
    - cron: '23 7 * * *'
    - cron: '37 13 * * *'
    - cron: '47 18 * * *'
  workflow_dispatch:
    inputs:
      custom_theme:
        description: 'Optional custom story theme (leave empty for automatic daily theme)'
        required: false
        default: ''
      skip_upload:
        description: 'Generate videos only without uploading to YouTube/TikTok'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-story-generator
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check if today's story was already published (backup cron guard)
        id: daily_guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'EOF'
          import os, urllib.request, json
          from datetime import datetime, timezone

          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          repo = os.environ["REPO"]
          current_id = str(os.environ["CURRENT_RUN_ID"])
          token = os.environ["GH_TOKEN"]

          url = f"https://api.github.com/repos/{repo}/actions/runs?status=success&per_page=10"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"})
          already_done = False
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode())
                  for r in data.get("workflow_runs", []):
                      if str(r.get("id")) != current_id and r.get("created_at", "").startswith(today):
                          print(f"Found successful run #{r.get('id')} from today ({today}). Skipping backup cron slot.")
                          already_done = True
                          break
          except Exception as e:
              print(f"Warning: could not query past runs ({e}), proceeding with run.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"already_done={'true' if already_done else 'false'}\n")
          EOF

      - name: Checkout repository
        if: steps.daily_guard.outputs.already_done != 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: steps.daily_guard.outputs.already_done != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg & Fonts)
        if: steps.daily_guard.outputs.already_done != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Python dependencies
        if: steps.daily_guard.outputs.already_done != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -n "${{ secrets.TIKTOK_COOKIES_JSON }}" ]; then
            playwright install chromium --with-deps
          fi

      - name: Random anti-detection delay (only on scheduled daily runs)
        if: github.event_name == 'schedule' && steps.daily_guard.outputs.already_done != 'true'
        run: |
          # Sleep between 3 minutes (180s) and 45 minutes (2700s) so daily posts happen at organic, unpredictable times
          DELAY_SEC=$(( 180 + (RANDOM * RANDOM) % 2520 ))
          echo "Sleeping for ${DELAY_SEC} seconds (~$(( DELAY_SEC / 60 )) mins) to randomize today's post time..."
          sleep "${DELAY_SEC}"

      - name: Run Master Story Generation & Dual Upload Script
        if: steps.daily_guard.outputs.already_done != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          TTS_VOICE: en-US-AriaNeural
          IMAGE_PROVIDER: pollinations
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_IMAGE_MODEL: black-forest-labs/flux.1-schnell
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: public
          YOUTUBE_MADE_FOR_KIDS: 'false'
          YOUTUBE_UPLOAD_SHORT: 'true'
          TIKTOK_UPLOAD_MODE: auto
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_COOKIES_JSON: ${{ secrets.TIKTOK_COOKIES_JSON }}
        run: |
          ARGS=()
          if [ -n "${{ github.event.inputs.custom_theme }}" ]; then
            ARGS+=(--theme "${{ github.event.inputs.custom_theme }}")
          fi
          if [ "${{ github.event.inputs.skip_upload }}" == "true" ]; then
            ARGS+=(--skip-upload)
          fi
          python main.py "${ARGS[@]}"

      - name: Upload generated videos & subtitles as workflow artifacts
        if: always() && steps.daily_guard.outputs.already_done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-story-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            output/final_story_youtube_16x9.mp4
            output/final_story_tiktok_9x16.mp4
            output/subtitles.srt
            output/metadata.json
          retention-days: 7
